database:
  host: "localhost"
  port: 5432
  name: "my_database"
  user: "my_user"
  password: "my_password"

server:
  host: ""
  port: 0

api:
  api_key: ""
  api_secret: ""
  base_url: ""
  endpoints:
    - request:
        uri: "/api/diagnostics/interface/search_arp/"
        method: "POST"
        response_type: "application/json"
        params: {}
        request_body: 
          current: 1
          rowCount: -1
          resolve: "no"
      response_obj_type: "ArpTableEntry"
      type: "request"

    - request:
        uri: "/api/diagnostics/interface/getInterfaceStatistics"
        method: "GET"
        response_type: "application/json"
        params: {}
        request_body: {}
      response_obj_type: "IFaceStatistics"
      type: "request"

    - request:
        uri: "/api/diagnostics/firewall/query_pf_top"
        method: "POST"
        response_type: "application/json"
        params: {}
        request_body:
          current: 1
          rowCount: -1
      response_obj_type: "FirewallSession"
      type: "request"

    - request:
        uri: "/api/diagnostics/firewall/query_states"3
        method: "POST"
        response_type: "application/json"
        params: {}
        request_body:
          current: 1
          rowCount: -1
      response_obj_type: "FirewallState"
      type: "request"

# Statistics for the firewall interfaces.
    - request:
        uri: "/api/diagnostics/firewall/pf_statistics/interfaces"
        method: "GET"
        response_type: "application/json"
        params: {}
        request_body: {}
      response_obj_type: "IfaceTraffic"
      type: "request"

# Live stream of firewall logs.
    - request:
        uri: "/api/diagnostics/firewall/log/"
        method: "GET"
        response_type: "application/json"
        params: 
          digest: ""
          limit: 10000
        request_body: {}
      response_obj_type: "FirewallLogEntry"
      type: "firewall_log_stream"
